<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Astro MP3 Player</title>
<style>
  :root{
    --bg-deep:#060a16;
    --bg-panel:#0a1022;
    --bg-panel-2:#0b1226;
    --bg-sidebar:#0a0f20;
    --line:#1c2742;
    --text:#e7ecf7;
    --text-dim:#7f8aab;
    --text-dimmer:#4b5675;
    --accent:#3fa7ff;
    --accent-2:#22d3ee;
    --accent-glow:rgba(63,167,255,0.35);
    --good:#22c55e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.3) 0, transparent 60%),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.22) 0, transparent 60%),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.18) 0, transparent 60%),
      radial-gradient(1px 1px at 30% 85%, rgba(255,255,255,0.25) 0, transparent 60%),
      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.18) 0, transparent 60%),
      radial-gradient(1px 1px at 45% 40%, rgba(255,255,255,0.15) 0, transparent 60%),
      var(--bg-deep);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
    min-width:1100px;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 32px;
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,0.015);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-icon{
    width:34px;height:34px;border-radius:9px;
    background:radial-gradient(circle at 30% 30%, #2a3a66, #0c1328);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;
  }
  .brand-name{font-weight:700;font-size:17px;letter-spacing:0.3px;}
  .brand-name span{color:var(--accent-2);}
  .live-dot{
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--text-dim);
    background:rgba(34,197,94,0.08);
    border:1px solid rgba(34,197,94,0.25);
    padding:5px 11px;border-radius:999px;
  }
  .live-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 6px var(--good);}
  .live-dot.off{color:var(--text-dimmer);border-color:var(--line);}
  .live-dot.off::before{background:var(--text-dimmer);box-shadow:none;}

  .layout{display:flex;align-items:stretch;min-height:calc(100vh - 68px);}

  .sidebar{
    width:400px;
    flex-shrink:0;
    padding:28px;
    border-right:1px solid var(--line);
    background:var(--bg-sidebar);
  }

  .art{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:14px;
    background:
      radial-gradient(circle at 30% 25%, rgba(63,167,255,0.18), transparent 55%),
      radial-gradient(circle at 75% 75%, rgba(34,211,238,0.12), transparent 55%),
      #0d1428;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    margin-bottom:20px;
  }
  .art canvas{position:absolute;inset:0;width:100%;height:100%;}
  .art-emoji{
    font-size:72px;
    filter:drop-shadow(0 0 24px var(--accent-glow));
    z-index:1;
  }
  .art-emoji.spin{animation:spin 8s linear infinite;}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

  .meta{text-align:center;margin-bottom:18px;}
  .meta .title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meta .artist{font-size:12.5px;color:var(--text-dim);margin-top:4px;}

  .progress-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .time{font-size:10.5px;color:var(--text-dimmer);min-width:34px;font-variant-numeric:tabular-nums;}
  .time.right{text-align:right;}
  input[type="range"]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:var(--line);outline:none;cursor:pointer;}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-glow);cursor:pointer;margin-top:-4.5px;}
  input[type="range"]::-webkit-slider-runnable-track{height:4px;border-radius:4px;}
  #seek{background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--pct,0%),var(--line) var(--pct,0%),var(--line) 100%);}

  .controls{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:20px;}
  .ctrl-btn{background:transparent;border:none;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;opacity:0.85;transition:opacity .15s, transform .1s;}
  .ctrl-btn:hover{opacity:1;}
  .ctrl-btn:active{transform:scale(0.92);}
  .ctrl-btn svg{width:21px;height:21px;}
  .ctrl-btn.toggle.active{color:var(--accent-2);opacity:1;}
  .play-btn{
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(180deg,#4db2ff,#2f8ce0);
    border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 8px 24px -6px rgba(63,167,255,0.6);transition:transform .1s;
  }
  .play-btn:active{transform:scale(0.93);}
  .play-btn svg{width:23px;height:23px;fill:#061020;}

  .volume-row{display:flex;align-items:center;gap:10px;padding:0 2px;}
  .volume-row svg{width:16px;height:16px;color:var(--text-dim);flex-shrink:0;}
  #volume{height:3px;}
  #volume::-webkit-slider-thumb{width:11px;height:11px;margin-top:-4px;}

  .main{flex:1;padding:28px 32px;min-width:0;}

  .main-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .main-head h1{font-size:16px;margin:0;font-weight:700;}
  .track-count{font-size:12px;color:var(--text-dimmer);}

  .upload-zone{
    border:1.5px dashed var(--line);
    border-radius:12px;
    padding:28px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    color:var(--text-dim);
    font-size:13px;
    margin-bottom:22px;
  }
  .upload-zone:hover{border-color:var(--accent);background:rgba(63,167,255,0.04);}
  .upload-zone input{display:none;}
  .upload-zone .icon{font-size:26px;margin-bottom:8px;display:block;}
  .upload-zone .sub{font-size:11px;color:var(--text-dimmer);margin-top:4px;}

  .playlist-header{
    display:grid;
    grid-template-columns:36px 1fr 90px 36px;
    gap:10px;
    padding:0 12px 10px;
    font-size:10.5px;
    letter-spacing:0.4px;
    color:var(--text-dimmer);
    border-bottom:1px solid var(--line);
    margin-bottom:6px;
  }

  .playlist{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 420px);overflow-y:auto;}
  .playlist::-webkit-scrollbar{width:7px;}
  .playlist::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .track-row{
    display:grid;
    grid-template-columns:36px 1fr 90px 36px;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:9px;
    background:rgba(255,255,255,0.015);
    border:1px solid transparent;
    cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  .track-row:hover{background:rgba(255,255,255,0.035);}
  .track-row.active{background:rgba(63,167,255,0.08);border-color:rgba(63,167,255,0.3);}
  .track-num{text-align:center;font-size:12px;color:var(--text-dimmer);font-variant-numeric:tabular-nums;}
  .track-row.active .track-num{color:var(--accent-2);}
  .track-info{min-width:0;}
  .track-name{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track-row.active .track-name{color:var(--accent-2);font-weight:600;}
  .track-dur{font-size:11px;color:var(--text-dimmer);text-align:right;font-variant-numeric:tabular-nums;}
  .track-remove{
    width:22px;height:22px;border-radius:5px;border:none;background:transparent;
    color:var(--text-dimmer);cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:14px;opacity:0;transition:opacity .12s, color .12s;
  }
  .track-row:hover .track-remove{opacity:1;}
  .track-remove:hover{color:#ef4444;}

  .empty-playlist{text-align:center;padding:50px 10px;color:var(--text-dimmer);font-size:13px;}
  .empty-playlist .e{font-size:28px;display:block;margin-bottom:8px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon">🛸</div>
    <div class="brand-name">ASTRO <span>MP3</span></div>
  </div>
  <div class="live-dot off" id="liveDot">idle</div>
</div>

<div class="layout">

  <div class="sidebar">
    <div class="art">
      <canvas id="viz"></canvas>
      <div class="art-emoji" id="artEmoji">🪐</div>
    </div>

    <div class="meta">
      <div class="title" id="trackTitle">No track loaded</div>
      <div class="artist" id="trackArtist">Add a song to begin</div>
    </div>

    <div class="progress-row">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" value="0" min="0" max="100" step="0.1">
      <span class="time right" id="durTime">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn toggle" id="shuffleBtn" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button class="ctrl-btn" id="prevBtn" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="play-btn" id="playBtn" title="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
      <button class="ctrl-btn toggle" id="repeatBtn" title="Repeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <input type="range" id="volume" min="0" max="100" value="70">
    </div>
  </div>

  <div class="main">
    <div class="main-head">
      <h1>Playlist</h1>
      <span class="track-count" id="trackCount">0 tracks</span>
    </div>

    <label class="upload-zone" id="uploadZone">
      <span class="icon">📡</span>
      Drop MP3 files here or click to browse
      <div class="sub">Files play locally in your browser — nothing is uploaded anywhere</div>
      <input type="file" id="fileInput" accept="audio/*" multiple>
    </label>

    <div class="playlist-header">
      <div>#</div><div>TITLE</div><div style="text-align:right;">TIME</div><div></div>
    </div>

    <div class="playlist" id="playlist">
      <div class="empty-playlist" id="emptyPlaylist">
        <span class="e">👾</span>
        No tracks yet — beam some up!
      </div>
    </div>
  </div>

</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function(){
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const seek = document.getElementById('seek');
  const curTime = document.getElementById('curTime');
  const durTime = document.getElementById('durTime');
  const volume = document.getElementById('volume');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const fileInput = document.getElementById('fileInput');
  const uploadZone = document.getElementById('uploadZone');
  const playlistEl = document.getElementById('playlist');
  const emptyPlaylist = document.getElementById('emptyPlaylist');
  const artEmoji = document.getElementById('artEmoji');
  const liveDot = document.getElementById('liveDot');
  const trackCount = document.getElementById('trackCount');
  const canvas = document.getElementById('viz');
  const ctx = canvas.getContext('2d');

  let tracks = [];
  let currentIndex = -1;
  let isShuffle = false;
  let isRepeat = false;
  let isPlaying = false;

  const EMOJIS = ['🪐','🌙','⭐','🚀','👽','🛰️','☄️','🌌'];

  function fmtTime(s){
    if(!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60);
    return m + ':' + String(sec).padStart(2,'0');
  }

  function renderPlaylist(){
    trackCount.textContent = tracks.length + (tracks.length === 1 ? ' track' : ' tracks');
    playlistEl.innerHTML = '';
    if(tracks.length === 0){
      playlistEl.appendChild(emptyPlaylist);
      return;
    }
    tracks.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'track-row' + (i === currentIndex ? ' active' : '');
      row.innerHTML = `
        <div class="track-num">${i+1}</div>
        <div class="track-info"><div class="track-name">${escapeHtml(t.name)}</div></div>
        <div class="track-dur">${t.duration ? fmtTime(t.duration) : '--:--'}</div>
        <button class="track-remove" title="Remove">✕</button>
      `;
      row.addEventListener('click', (e) => {
        if(e.target.classList.contains('track-remove')) return;
        loadTrack(i, true);
      });
      row.querySelector('.track-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        removeTrack(i);
      });
      playlistEl.appendChild(row);
    });
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function removeTrack(i){
    const wasPlaying = (i === currentIndex) && isPlaying;
    URL.revokeObjectURL(tracks[i].url);
    tracks.splice(i, 1);
    if(i === currentIndex){
      audio.pause();
      isPlaying = false;
      currentIndex = -1;
      if(tracks.length > 0){
        loadTrack(Math.min(i, tracks.length - 1), wasPlaying);
      } else {
        trackTitle.textContent = 'No track loaded';
        trackArtist.textContent = 'Add a song to begin';
        updatePlayIcon();
        setLive(false);
      }
    } else if(i < currentIndex){
      currentIndex--;
    }
    renderPlaylist();
  }

  function addFiles(fileList){
    const files = Array.from(fileList).filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|m4a|ogg|flac)$/i.test(f.name));
    if(files.length === 0) return;
    const startIdx = tracks.length;
    files.forEach(file => {
      const url = URL.createObjectURL(file);
      const name = file.name.replace(/\.[^/.]+$/, '');
      const t = { name, url, duration: 0, file };
      tracks.push(t);
      const probe = new Audio(url);
      probe.addEventListener('loadedmetadata', () => {
        t.duration = probe.duration;
        renderPlaylist();
      });
    });
    renderPlaylist();
    if(currentIndex === -1){
      loadTrack(startIdx, false);
    }
  }

  function loadTrack(i, autoplay){
    if(i < 0 || i >= tracks.length) return;
    currentIndex = i;
    const t = tracks[i];
    audio.src = t.url;
    trackTitle.textContent = t.name;
    trackArtist.textContent = 'Local file • Track ' + (i+1) + ' of ' + tracks.length;
    artEmoji.textContent = EMOJIS[i % EMOJIS.length];
    renderPlaylist();
    if(autoplay){
      audio.play().then(()=>{ isPlaying = true; updatePlayIcon(); setLive(true); }).catch(()=>{});
    }
  }

  function updatePlayIcon(){
    if(isPlaying){
      playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
      artEmoji.classList.add('spin');
    } else {
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      artEmoji.classList.remove('spin');
    }
  }

  function setLive(on){
    liveDot.textContent = on ? 'playing' : 'idle';
    liveDot.className = 'live-dot' + (on ? '' : ' off');
  }

  function togglePlay(){
    if(currentIndex === -1){
      if(tracks.length > 0) loadTrack(0, true);
      return;
    }
    if(isPlaying){
      audio.pause();
      isPlaying = false;
    } else {
      audio.play().then(()=>{ isPlaying = true; updatePlayIcon(); setLive(true); }).catch(()=>{});
      return;
    }
    updatePlayIcon();
    setLive(isPlaying);
  }

  function nextTrack(){
    if(tracks.length === 0) return;
    let i;
    if(isShuffle){
      do { i = Math.floor(Math.random() * tracks.length); } while(tracks.length > 1 && i === currentIndex);
    } else {
      i = (currentIndex + 1) % tracks.length;
    }
    loadTrack(i, true);
  }

  function prevTrack(){
    if(tracks.length === 0) return;
    if(audio.currentTime > 3){
      audio.currentTime = 0;
      return;
    }
    let i = (currentIndex - 1 + tracks.length) % tracks.length;
    loadTrack(i, true);
  }

  playBtn.addEventListener('click', togglePlay);
  nextBtn.addEventListener('click', nextTrack);
  prevBtn.addEventListener('click', prevTrack);

  shuffleBtn.addEventListener('click', () => {
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle('active', isShuffle);
  });
  repeatBtn.addEventListener('click', () => {
    isRepeat = !isRepeat;
    repeatBtn.classList.toggle('active', isRepeat);
  });

  audio.addEventListener('timeupdate', () => {
    if(!isFinite(audio.duration)) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    seek.value = pct;
    seek.style.setProperty('--pct', pct + '%');
    curTime.textContent = fmtTime(audio.currentTime);
    durTime.textContent = fmtTime(audio.duration);
  });

  audio.addEventListener('loadedmetadata', () => {
    durTime.textContent = fmtTime(audio.duration);
    if(currentIndex > -1 && tracks[currentIndex]){
      tracks[currentIndex].duration = audio.duration;
      renderPlaylist();
    }
  });

  audio.addEventListener('ended', () => {
    if(isRepeat){
      audio.currentTime = 0;
      audio.play();
    } else {
      nextTrack();
    }
  });

  audio.addEventListener('pause', () => {
    if(!audio.ended){ isPlaying = false; updatePlayIcon(); setLive(false); }
  });
  audio.addEventListener('play', () => {
    isPlaying = true; updatePlayIcon(); setLive(true);
  });

  seek.addEventListener('input', () => {
    if(!isFinite(audio.duration)) return;
    audio.currentTime = (seek.value / 100) * audio.duration;
  });

  volume.addEventListener('input', () => {
    audio.volume = volume.value / 100;
  });
  audio.volume = 0.7;

  fileInput.addEventListener('change', (e) => {
    addFiles(e.target.files);
    fileInput.value = '';
  });

  uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.style.borderColor = 'var(--accent)'; });
  uploadZone.addEventListener('dragleave', () => { uploadZone.style.borderColor = ''; });
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.style.borderColor = '';
    addFiles(e.dataTransfer.files);
  });

  let audioCtxObj, analyser, source, dataArray;
  function setupViz(){
    if(audioCtxObj) return;
    try{
      audioCtxObj = new (window.AudioContext || window.webkitAudioContext)();
      source = audioCtxObj.createMediaElementSource(audio);
      analyser = audioCtxObj.createAnalyser();
      analyser.fftSize = 64;
      source.connect(analyser);
      analyser.connect(audioCtxObj.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      drawViz();
    }catch(e){}
  }

  function resizeCanvas(){
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function drawViz(){
    requestAnimationFrame(drawViz);
    if(!ctx) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(!analyser || !isPlaying) return;
    analyser.getByteFrequencyData(dataArray);
    const barCount = dataArray.length;
    const w = canvas.width / barCount;
    ctx.save();
    ctx.globalAlpha = 0.5;
    for(let i=0;i<barCount;i++){
      const v = dataArray[i] / 255;
      const h = v * canvas.height * 0.6;
      const x = i * w;
      const y = canvas.height - h;
      const grad = ctx.createLinearGradient(0,y,0,canvas.height);
      grad.addColorStop(0, '#22d3ee');
      grad.addColorStop(1, '#3fa7ff');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w*0.6, h);
    }
    ctx.restore();
  }

  document.body.addEventListener('click', setupViz, { once: true });

})();
</script>

</body>
</html>
